# GitHub Actions — 自动编译 Android APK
# 推送到 GitHub 后自动触发，编译完成的 APK 可在 Actions 页面下载
name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 🔽 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装 Buildozer 依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git \
            wget \
            unzip \
            file \
            build-essential \
            ccache \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            python3-dev \
            python3-pip \
            python3-setuptools \
            curl \
            lsof \
            pkg-config \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            zlib1g-dev \
            libncurses-dev \
            libxml2-dev \
            libxslt1-dev

      - name: 💾 缓存 Buildozer（Android SDK/NDK）
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            !~/.buildozer/android/platform
          key: ${{ runner.os }}-buildozer-${{ hashFiles('mobile/buildozer.spec') }}

      - name: 💾 缓存 Android 平台
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform
          key: ${{ runner.os }}-android-platform-${{ hashFiles('mobile/buildozer.spec') }}

      - name: 🏗 编译 APK
        run: |
          bash ci_build.sh 2>&1

      - name: 📤 上传 APK 工件
        uses: actions/upload-artifact@v4
        with:
          name: VideoAudioDownloader-APK
          path: mobile/bin/*.apk
          if-no-files-found: error
