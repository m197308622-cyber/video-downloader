# GitHub Actions — 自动编译 Android APK
# v7: ubuntu-22.04 + 手动构建 + SDK 34 安装 + Cython
name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 🔽 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lsof pkg-config openjdk-17-jdk \
            autoconf automake libtool zlib1g-dev libncurses-dev \
            libxml2-dev libxslt1-dev ccache unzip wget

      - name: 🏗 编译 APK (ci_build.sh)
        run: |
          cd mobile
          bash ci_build.sh

      - name: 📤 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoAudioDownloader-APK
          path: mobile/bin/*.apk
          if-no-files-found: warn
