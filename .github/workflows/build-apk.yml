# GitHub Actions — 自动编译 Android APK
# 推送到 GitHub 后自动触发，编译完成的 APK 可在 Actions 页面下载
name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🔽 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lsof pkg-config openjdk-17-jdk autoconf automake libtool zlib1g-dev libncurses-dev libxml2-dev libxslt1-dev

      - name: 🏗 编译 APK
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: mobile
          buildozer_version: stable

      - name: 📤 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoAudioDownloader-APK
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error
